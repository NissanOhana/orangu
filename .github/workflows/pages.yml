# Deploys the single-file landing page in site/ to GitHub Pages.
#
# Pages source must be set to "GitHub Actions" (build_type=workflow), not the
# legacy branch/folder mode. Nothing is built here: site/index.html is already
# self-contained, so the job uploads site/ as-is and deploys that artifact.

name: Deploy landing page to GitHub Pages

on:
  # release.yml calls this as the last leg of a release, so the landing page and
  # the published artifacts always describe the same version.
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'

# Least privilege: the deploy step needs pages + an OIDC token; nothing writes to contents.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Do not cancel an in-flight deploy — let it finish,
# then the newest queued run deploys on top.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # main, or a release tag when release.yml calls this. Anything else (a
    # workflow_dispatch from a topic branch) is not the published site.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify committed site artifacts
        run: npm run verify:generated

      - name: Verify landing network policy
        run: node scripts/assert-offline.mjs --site

      - name: Upload site/ as the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
